# /etc/systemd/system/ssl-racoon.service.d/wait-6ghz.conf
#
# 2026-09-22 に Rock5A の機体 (robot 15) から取得したもの (無変更)。
# wifi-prefer-6ghz.service は機体上にだけあり、このリポジトリには入っていない。
[Unit]
# Start only after the 6 GHz preference step has settled the Wi-Fi link,
# so ssl-racoon does not come up on a band that is about to change.
After=wifi-prefer-6ghz.service
Wants=wifi-prefer-6ghz.service
